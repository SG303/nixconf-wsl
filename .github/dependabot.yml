# Dependabot config (SG303 baseline v1). Dependabot cannot update Nix flake
# inputs (see AGENTS.md); this keeps the GitHub Actions up to date. Weekly on
# Sunday evening, minor and patch updates grouped and merged automatically by
# dependabot-auto-merge.yml once the checks pass. 7-day cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
